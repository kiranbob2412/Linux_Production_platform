[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

    Parsers_File /etc/fluent-bit/parsers.conf

[INPUT]
    Name              tail
    Tag               linux.logs
    Path              /var/log/*.log
    Read_from_Head    False
    Refresh_Interval  5
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB

[OUTPUT]
    Name              opentelemetry
    Match             linux.logs

    Host              127.0.0.1
    Port              4318

    Logs_uri          /v1/logs

    TLS               Off
