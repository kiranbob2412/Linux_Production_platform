global:
  resolve_timeout: 5m

route:
  group_by:
    - alertname
    - severity
    - component

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  receiver: default

  routes:
    - matchers:
        - severity="critical"
      receiver: critical

    - matchers:
        - severity="warning"
      receiver: warning

receivers:
  - name: default

  - name: warning

  - name: critical
