receivers:
  filelog/system:
    include:
      - /var/log/syslog
      - /var/log/auth.log
      - /var/log/kern.log
    start_at: end
    include_file_path: true
    include_file_name: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    logs:
      receivers:
        - filelog/system
      processors:
        - memory_limiter
        - batch
      exporters:
        - debug
